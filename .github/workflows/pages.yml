name: Deploy TELEDOG website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir -p public
          cp index.html style.css gallery-stories.js hall.js app.js navigation.js x-logo.js interactions.js visual-fixes.js speaker.js speaker-player.js speaker-notes.js room-sounds.js seated-repair.js public/
          cp -r vendor public/vendor
          mkdir -p public/assets
          cp assets/teledog-character.png assets/honkler-character.png assets/fast-character.png assets/clown-head.json assets/groyper_green.glb.gz assets/hall.glb.gz assets/room.glb.part1 assets/room.glb.part2 assets/room-poster.png assets/own-live-internet.mp3 assets/faithful-vpns.mp3 public/assets/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
